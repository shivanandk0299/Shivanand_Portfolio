<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>
    <linearGradient id="curveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="regGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <pattern id="gridPattern" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="360" fill="url(#bgGrad)" />
  <rect width="600" height="360" fill="url(#gridPattern)" />

  <!-- Ambient Light Orbs -->
  <circle cx="480" cy="80" r="120" fill="#6366f1" opacity="0.08" filter="blur(40px)" />
  <circle cx="120" cy="280" r="100" fill="#38bdf8" opacity="0.06" filter="blur(40px)" />

  <!-- Header Bar / Window Frame -->
  <rect x="24" y="24" width="552" height="40" rx="8" fill="#131d31" stroke="#22324e" stroke-width="1" />
  <circle cx="46" cy="44" r="5" fill="#ef4444" opacity="0.8" />
  <circle cx="62" cy="44" r="5" fill="#f59e0b" opacity="0.8" />
  <circle cx="78" cy="44" r="5" fill="#10b981" opacity="0.8" />
  <text x="105" y="48" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#94a3b8">climate_prediction.py — Illustrative project visual</text>
  <rect x="470" y="32" width="94" height="24" rx="4" fill="#1e293b" />
  <text x="517" y="48" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#38bdf8" text-anchor="middle">Regression concept</text>

  <!-- Main Chart Canvas -->
  <g transform="translate(40, 85)">
    <!-- Chart Box -->
    <rect width="360" height="225" rx="8" fill="url(#cardGrad)" stroke="#27354f" stroke-width="1" />

    <!-- Chart Grid Lines -->
    <line x1="40" y1="40" x2="330" y2="40" stroke="#1e293b" stroke-width="1" stroke-dasharray="3,3" />
    <line x1="40" y1="90" x2="330" y2="90" stroke="#1e293b" stroke-width="1" stroke-dasharray="3,3" />
    <line x1="40" y1="140" x2="330" y2="140" stroke="#1e293b" stroke-width="1" stroke-dasharray="3,3" />
    <line x1="40" y1="190" x2="330" y2="190" stroke="#334155" stroke-width="1.2" />
    <line x1="40" y1="20" x2="40" y2="190" stroke="#334155" stroke-width="1.2" />

    <!-- Scatter Data Points (Raw Observations) -->
    <g fill="#38bdf8" opacity="0.65">
      <circle cx="55" cy="175" r="3.5" />
      <circle cx="75" cy="162" r="3" />
      <circle cx="95" cy="155" r="4" />
      <circle cx="115" cy="168" r="3" />
      <circle cx="130" cy="140" r="3.5" />
      <circle cx="150" cy="132" r="4" />
      <circle cx="170" cy="145" r="3" />
      <circle cx="195" cy="115" r="3.5" />
      <circle cx="215" cy="108" r="4" />
      <circle cx="240" cy="98" r="3.5" />
      <circle cx="260" cy="110" r="3" />
      <circle cx="280" cy="85" r="4" />
      <circle cx="305" cy="72" r="3.5" />
      <circle cx="325" cy="60" r="4" />
    </g>

    <!-- Fitted Linear Regression Model Line -->
    <line x1="45" y1="180" x2="325" y2="65" stroke="url(#regGrad)" stroke-width="3" stroke-linecap="round" />

    <!-- Confidence Interval / Gradient Fill Under Trend -->
    <path d="M 45 180 L 325 65 L 325 190 L 45 190 Z" fill="url(#curveGrad)" opacity="0.08" />

    <!-- Metric Callout on Plot -->
    <rect x="180" y="25" width="135" height="34" rx="4" fill="#090d16" stroke="#4338ca" stroke-width="1" />
    <text x="190" y="40" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" fill="#a5b4fc">Illustrative trend only</text>
    <text x="190" y="52" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" fill="#94a3b8">Not measured results</text>

    <!-- Axis Labels -->
    <text x="40" y="210" font-family="sans-serif" font-size="10" fill="#64748b" >Input</text>
    <text x="175" y="210" font-family="sans-serif" font-size="10" fill="#64748b">Feature value</text>
    <text x="315" y="210" font-family="sans-serif" font-size="10" fill="#64748b" >Output</text>
  </g>

  <!-- Side Metrics & Feature Importance Panel -->
  <g transform="translate(415, 85)">
    <!-- Metric Card 1: Features -->
    <rect width="160" height="68" rx="8" fill="url(#cardGrad)" stroke="#27354f" stroke-width="1" />
    <text x="14" y="24" font-family="sans-serif" font-size="11" font-weight="600" fill="#94a3b8">PREDICTION TARGET</text>
    <text x="14" y="44" font-family="sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Climate variable</text>
    <text x="14" y="58" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38bdf8">Dataset dependent</text>

    <!-- Metric Card 2: Methodology -->
    <rect y="78" width="160" height="68" rx="8" fill="url(#cardGrad)" stroke="#27354f" stroke-width="1" />
    <text x="14" y="102" font-family="sans-serif" font-size="11" font-weight="600" fill="#94a3b8">MODEL APPROACH</text>
    <text x="14" y="122" font-family="sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Linear Regression</text>
    <text x="14" y="136" font-family="'JetBrains Mono', monospace" font-size="10" fill="#a78bfa">Implementation to verify</text>

    <!-- Metric Card 3: Evaluation -->
    <rect y="156" width="160" height="68" rx="8" fill="url(#cardGrad)" stroke="#27354f" stroke-width="1" />
    <text x="14" y="180" font-family="sans-serif" font-size="11" font-weight="600" fill="#94a3b8">EVALUATION</text>
    <text x="14" y="200" font-family="sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Metrics pending</text>
    <text x="14" y="214" font-family="'JetBrains Mono', monospace" font-size="10" fill="#10b981">Add measured results</text>
  </g>
</svg>
